<!doctype html>
<html lang="uz-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Обе темы поддержаны: браузер красит холст, скроллбары и поля формы под
         системную настройку, не дожидаясь загрузки CSS. -->
    <meta name="color-scheme" content="light dark" />
    <title>RavonRoad</title>
    <!-- Шрифты локальные: сторонний CDN добавил бы DNS и TLS к первому экрану,
         а на мобильном интернете это заметные секунды (PRD §8.1). -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Браузер без модулей не выполнит из main.tsx ни строки: тег ниже он пропустит
         целиком и оставит белую страницу — ровно то, чего PRD §8.5 не допускает.
         Сообщение поэтому лежит здесь, сразу на двух языках и без словаря локали:
         словарь — тоже модуль, и прочитать его такому браузеру нечем. -->
    <script nomodule>
      document.getElementById('root').textContent =
        'Brauzer qoʻllab-quvvatlanmaydi, uni yangilang. — Браузер не поддерживается, обновите его.'
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
