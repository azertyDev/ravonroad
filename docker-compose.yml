# Одна и та же composition поднимается на проде и на dev; различаются только лимиты
# памяти и настройки Postgres, они лежат в оверлеях (SRS §12).
#
#   локально   docker compose up
#   прод       docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   dev        docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Миграции — отдельный одноразовый запуск: docker compose run --rm migrate

name: ravonroad

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: postgis/postgis:17-3.5
    # Образ публикуется только под amd64; на arm64-машине разработчика он идёт
    # через эмуляцию, оба сервера кампании — amd64.
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ravonroad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ravonroad}
      POSTGRES_DB: ${POSTGRES_DB:-ravonroad}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ravonroad} -d ${POSTGRES_DB:-ravonroad}']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  api:
    image: ${API_IMAGE:-ravonroad-api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3000
      # Внутри composition база доступна по имени сервиса; DATABASE_URL из .env
      # описывает доступ с хоста и здесь не годится.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ravonroad}:${POSTGRES_PASSWORD:-ravonroad}@db:5432/${POSTGRES_DB:-ravonroad}?schema=public
      WEB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      # Хранилище фотографий обязательно с 002: без него заявка не принимается вовсе.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      # Бот — модуль внутри api (ADR-0002), поэтому доступ к Telegram нужен именно ему,
      # и он обязателен: без него модерация встаёт молча, а карточки копятся в очереди.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_GROUP_CHAT_ID: ${TELEGRAM_GROUP_CHAT_ID}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      # Второй эшелон обороны webhook и первичный засев allowlist — необязательные.
      TELEGRAM_WEBHOOK_PATH: ${TELEGRAM_WEBHOOK_PATH:-}
      TELEGRAM_MODERATOR_IDS: ${TELEGRAM_MODERATOR_IDS:-}
      INTAKE_CONCURRENCY: ${INTAKE_CONCURRENCY:-8}
      PHOTO_WORKERS: ${PHOTO_WORKERS:-1}
      # libvips не поднимает пул потоков: обработка идёт по одной фотографии за раз,
      # и пик памяти остаётся ~15 МБ поверх базовой, а не кратным числу ядер (SRS §5.7).
      VIPS_CONCURRENCY: 1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  edge:
    image: ${EDGE_IMAGE:-ravonroad-edge:local}
    build:
      context: .
      dockerfile: Dockerfile.web
      # Vite запекает VITE_* в бандл при сборке образа, а не читает их в рантайме.
      args:
        VITE_MAP_PMTILES_URL: ${VITE_MAP_PMTILES_URL:-}
        VITE_CAMPAIGN_CONTACT_URL: ${VITE_CAMPAIGN_CONTACT_URL:-}
    environment:
      # Тот же адрес, что запечён в бандл: из него envsubst собирает connect-src в CSP.
      # Разъедутся — браузер заблокирует тайлы, поэтому переменная в .env одна.
      MAP_PMTILES_URL: ${VITE_MAP_PMTILES_URL:-}
      # Домен сертификата. Пусто — контейнер работает по http, как раньше.
      TLS_DOMAIN: ${TLS_DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Сертификаты выпускает и продлевает certbot на хосте; nginx только читает.
      - ${LETSENCRYPT_DIR:-./.letsencrypt}:/etc/letsencrypt:ro
      # Каталог ACME-проверки общий с certbot: файл кладёт он, отдаёт nginx.
      - ${CERTBOT_WEBROOT:-./.certbot}:/var/www/certbot
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  # Одноразовый: поднимается через docker compose run, накатывает миграции и выходит.
  # Профиль держит его вне docker compose up — постоянного контейнера под миграции нет
  # (SRS §12.2 п.2).
  migrate:
    image: ${MIGRATE_IMAGE:-ravonroad-migrate:local}
    build:
      context: .
      dockerfile: Dockerfile.migrate
    profiles: ['tools']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ravonroad}:${POSTGRES_PASSWORD:-ravonroad}@db:5432/${POSTGRES_DB:-ravonroad}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    logging: *logging

volumes:
  db-data:
