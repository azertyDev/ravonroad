name: ci

# Гейт ветки: изменения попадают в dev только через Pull Request, и красная проверка
# блокирует мерж (CLAUDE.md › Ветки).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  checks:
    runs-on: ubuntu-latest

    # Интеграционные тесты идут в настоящий PostGIS: ST_Contains по мультиполигону,
    # CHECK-инварианты и SKIP LOCKED не проверяются моком (SRS §11.3). Образ тот же,
    # что в docker-compose, — тест на другой версии расширения не доказывал бы ничего.
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ravonroad
          POSTGRES_PASSWORD: ravonroad
          POSTGRES_DB: ravonroad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ravonroad -d ravonroad"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgresql://ravonroad:ravonroad@localhost:5432/ravonroad?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall порождает Prisma Client, prepare собирает shared-types —
      # без них typecheck не с чем сверять.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Бюджет трафика проверяется на собранном бандле, а не на глаз в ревью:
      # превышение ломает сборку (PRD §8.1, SRS §7.7).
      - run: pnpm build
      - run: node scripts/bundle-budget.mjs
