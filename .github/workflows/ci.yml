name: ci

# Гейт ветки: изменения попадают в dev только через Pull Request, и красная проверка
# блокирует мерж (CLAUDE.md › Ветки).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  checks:
    runs-on: ubuntu-latest

    # Базу под интеграционные тесты поднимает сам прогон через Testcontainers (SRS §11.3),
    # поэтому service-контейнера здесь нет: Docker на ubuntu-latest уже есть.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall порождает Prisma Client, prepare собирает shared-types —
      # без них typecheck не с чем сверять.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Бюджет трафика проверяется на собранном бандле, а не на глаз в ревью:
      # превышение ломает сборку (PRD §8.1, SRS §7.7).
      - run: pnpm build
      - run: node scripts/bundle-budget.mjs
