name: build

# Образы собираются только для интеграционной ветки: на серверах кампании
# выполняется docker pull, а не docker build (SRS §12.2 п.1).
on:
  push:
    branches: [dev]
  # Сборка произвольной ветки. Нужна не разово: доказательство иногда живёт внутри
  # образа (логи api, маршруты nginx), а `docker build` на серверах запрещён —
  # e2-micro упирается в память и в 0,25 vCPU baseline (SRS §12.2 п.1). Собранный тег
  # выкатывается штатным `deploy-dev` и так же штатно откатывается обратно на dev.
  workflow_dispatch:
    inputs:
      ref:
        description: ветка или sha, образы которых собрать
        required: false
        default: dev

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: edge
            dockerfile: Dockerfile.web
          - name: migrate
            dockerfile: Dockerfile.migrate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Тег образа — sha того, что реально собрано. При ручном запуске `github.sha`
      # указывает на ветку запуска, а не на то, что положил checkout.
      - id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # GHCR принимает только строчные имена, а владелец репозитория пишется смешанным.
      - id: name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Без этого шага сборка идёт драйвером `docker`, который не умеет экспортировать
      # кэш: `cache-to: type=gha` падает с «Cache export is not supported for the docker
      # driver». Действие поднимает билдер на драйвере `docker-container`, где экспорт
      # работает. Кэш здесь не украшение: три образа собираются из общего pnpm-workspace,
      # и без него каждый тянет зависимости заново.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Обе машины кампании amd64. Вторая платформа добавляется здесь, если
          # архитектура VPS окажется arm64 (SRS §16 п.7).
          platforms: linux/amd64
          # Статика web собирается внутри образа, и VITE_* обязаны быть здесь: в рантайме
          # их уже не подставить. Значение по умолчанию — публичный адрес dev-экстракта,
          # переменная репозитория перебивает его, не трогая workflow.
          build-args: |
            VITE_MAP_PMTILES_URL=${{ vars.VITE_MAP_PMTILES_URL || 'https://storage.googleapis.com/ravonroad-dev-photos/map/tashkent-20260810.pmtiles' }}
            VITE_CAMPAIGN_CONTACT_URL=${{ vars.VITE_CAMPAIGN_CONTACT_URL }}
          push: true
          # Плавающий тег `dev` двигается только сборкой dev: иначе он однажды указал бы
          # на ветку, и «что развёрнуто» перестало бы читаться по имени образа.
          tags: |
            ghcr.io/${{ steps.name.outputs.repo }}-${{ matrix.name }}:${{ steps.sha.outputs.value }}
            ${{ (inputs.ref || 'dev') == 'dev' && format('ghcr.io/{0}-{1}:dev', steps.name.outputs.repo, matrix.name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
