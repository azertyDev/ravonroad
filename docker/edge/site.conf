# Тело сайта: маршруты, кэш, статика. Подключается ОБОИМИ серверами — и 80, и 443,
# — потому что различаются они ровно двумя вещами: портом и сертификатом. Всё
# остальное обязано совпадать.
#
# Файл появился после дефекта: TLS-сервер был написан отдельной копией и не получил
# микрокэш, приехавший в 003. Пока каноническим origin был http, этого никто не видел;
# после переезда на https микрокэш замолчал целиком — то есть ровно та защита, ради
# которой он и делался, исчезла при всплеске. Дублировать конфигурацию сервера здесь
# нельзя: расхождение не даёт ни ошибки, ни строчки в логе.

include /etc/nginx/conf.d/security-headers.conf;

# Проверка владения доменом для Let's Encrypt. Отдаётся и по http, и по https:
# продление идёт тем же способом, что и выпуск.
location ^~ /.well-known/acme-challenge/ {
  root /var/www/certbot;
  default_type "text/plain";
}

# Четыре публичных чтения на кэше. Регулярное выражение перекрывает префикс /api/
# ниже: у nginx regex-location старше prefix-location, и порядок здесь ни при чём.
location ~ ^/api/(reports/map|stats|districts|categories)$ {
  proxy_pass http://api:3000;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;

  proxy_cache api;
  proxy_cache_valid 200 30s;
  # Главная строка: без неё истечение TTL под нагрузкой отправляет в Node столько
  # запросов, сколько пришло, — то есть ровно в момент всплеска (SRS §12.3 п.5).
  proxy_cache_lock on;
  proxy_cache_lock_timeout 10s;
  # Просроченный ответ отдаётся, пока один запрос обновляет кэш: посетитель никогда
  # не ждёт обращения к БД.
  proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
  proxy_cache_background_update on;
  # add_header в location отменяет унаследованные, поэтому заголовки безопасности
  # подключаются здесь заново — иначе кэшируемые ответы уходили бы без них.
  include /etc/nginx/conf.d/security-headers.conf;
  add_header X-Cache-Status $upstream_cache_status always;
}

# Всё остальное — мимо кэша: подача заявки, страница отслеживания с её no-store
# и вебхук бота персональны или изменяют данные.
location /api/ {
  proxy_pass http://api:3000;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;
}

# Проверки живости api, без префикса /api (SRS §4.1, §10.4). Точное совпадение
# обязательно: иначе оба адреса проваливаются в SPA-fallback ниже и внешний пинг
# аптайма получает index.html с кодом 200 при мёртвом api. Заголовки прокси здесь
# не нужны — за ними приходит монитор, а не житель.
location = /health {
  proxy_pass http://api:3000;
  proxy_http_version 1.1;
  proxy_read_timeout 5s;
}

location = /ready {
  proxy_pass http://api:3000;
  proxy_http_version 1.1;
  proxy_read_timeout 5s;
}

# Диагностическая сводка (SRS §10.1). Отдельным точным location по той же причине,
# что /health и /ready: без него адрес проваливается в SPA-fallback и отвечает index.html
# с кодом 200. Таймаут выше: внутри проверки S3 и Telegram, и первая после истечения
# кэша идёт наружу.
location = /health/details {
  proxy_pass http://api:3000;
  proxy_http_version 1.1;
  proxy_read_timeout 15s;
}

root /usr/share/nginx/html;
index index.html;

# Имена ассетов содержат хеш содержимого — их можно кэшировать навсегда.
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable" always;
  include /etc/nginx/conf.d/security-headers.conf;
  try_files $uri =404;
}

location /fonts/ {
  expires 1y;
  add_header Cache-Control "public, immutable" always;
  include /etc/nginx/conf.d/security-headers.conf;
  try_files $uri =404;
}

# SPA-fallback: без него прямая ссылка /ru/z/<token> дала бы 404 от статики (SRS §7.2).
location / {
  expires -1;
  try_files $uri $uri/ /index.html;
}
