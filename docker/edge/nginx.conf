# edge: статика web, reverse proxy на api, SPA-fallback и заголовки безопасности
# (SRS §1.1, §7.2, §9.8). worker_processes = 1 — контейнеру отведено 96 МБ (SRS §12.1).

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # $upstream_http_x_request_id — тот же correlation id, что api вернул клиенту (SRS §8.3):
  # свой $request_id nginx писать не должен, иначе в логах двух сторон разные значения.
  log_format json escape=json '{"ts":"$time_iso8601","msg":"http_request",'
    '"correlationId":"$upstream_http_x_request_id","route":"$request_method $uri",'
    '"status":$status,"durMs":$request_time,"bytes":$body_bytes_sent}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/wasm;
  # brotli в официальном образе nginx не собран: ngx_brotli требует пересборки образа.
  # Бюджет PRD §8.1 считается по br в CI (scripts/bundle-budget.mjs), отдача — gzip.

  client_max_body_size 25m;

  # TLS-сервер, если сертификат выпущен. Шаблон кладёт сюда 20-enable-tls.sh при старте
  # контейнера; шаблон с подстановкой по маске терпит отсутствие файлов, поэтому до
  # первого выпуска nginx поднимается как обычно, по одному 80 порту.
  include /etc/nginx/conf.d/tls/*.conf;

  # Микрокэш публичного чтения (SRS §4.7). Анонс на 127 000 подписчиков даёт десятки тысяч
  # сессий, и почти все они запрашивают одно и то же: точки карты и счётчик. Ни один
  # из этих ответов не персонализирован. 64 МБ лежат на диске, а не в памяти: контейнеру
  # отведено 96 МБ (SRS §12.1), а кэшируемых ответов единицы.
  proxy_cache_path /var/cache/nginx keys_zone=api:8m max_size=64m inactive=5m;

  server {
    listen 80;
    server_name _;

    include /etc/nginx/conf.d/security-headers.conf;

    # Проверка владения доменом для Let's Encrypt. Отдаётся по http и остаётся
    # доступной после включения TLS: продление идёт тем же способом, что и выпуск.
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
    }

    # Четыре публичных чтения на кэше. Регулярное выражение перекрывает префикс /api/
    # ниже: у nginx regex-location старше prefix-location, и порядок здесь ни при чём.
    location ~ ^/api/(reports/map|stats|districts|categories)$ {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;

      proxy_cache api;
      proxy_cache_valid 200 30s;
      # Главная строка: без неё истечение TTL под нагрузкой отправляет в Node столько
      # запросов, сколько пришло, — то есть ровно в момент всплеска (SRS §12.3 п.5).
      proxy_cache_lock on;
      proxy_cache_lock_timeout 10s;
      # Просроченный ответ отдаётся, пока один запрос обновляет кэш: посетитель никогда
      # не ждёт обращения к БД.
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      # add_header в location отменяет унаследованные, поэтому заголовки безопасности
      # подключаются здесь заново — иначе кэшируемые ответы уходили бы без них.
      include /etc/nginx/conf.d/security-headers.conf;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # Всё остальное — мимо кэша: подача заявки, страница отслеживания с её no-store
    # и вебхук бота персональны или изменяют данные.
    location /api/ {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # Проверки живости api, без префикса /api (SRS §4.1, §10.4). Точное совпадение
    # обязательно: иначе оба адреса проваливаются в SPA-fallback ниже и внешний пинг
    # аптайма получает index.html с кодом 200 при мёртвом api. Заголовки прокси здесь
    # не нужны — за ними приходит монитор, а не житель.
    location = /health {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_read_timeout 5s;
    }

    location = /ready {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_read_timeout 5s;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Имена ассетов содержат хеш содержимого — их можно кэшировать навсегда.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      include /etc/nginx/conf.d/security-headers.conf;
      try_files $uri =404;
    }

    location /fonts/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      include /etc/nginx/conf.d/security-headers.conf;
      try_files $uri =404;
    }

    # SPA-fallback: без него прямая ссылка /ru/z/<token> дала бы 404 от статики (SRS §7.2).
    location / {
      expires -1;
      try_files $uri $uri/ /index.html;
    }
  }
}
