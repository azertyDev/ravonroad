# Заголовки безопасности SRS §9.8. Подключаются и в server, и в каждый location,
# где есть свой add_header: nginx не наследует add_header на уровень, где он объявлен
# заново, и молча потерял бы весь этот файл.

add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "geolocation=(self), camera=()" always;

# TLS терминируется здесь же, когда появится домен и сертификат (spec «требует решения», п.3).
# До этого заголовок отдаётся, но браузером по http игнорируется.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Стороннего скрипта на странице больше нет: карта — это MapLibre из нашего же бандла,
# а тайлы лежат в нашем бакете. Хост бакета не вписан намеренно: он разный на dev и проде,
# и появится здесь через шаблон nginx вместе с первым PMTiles-экстрактом и первым показом
# фотографий — обоим нужны img-src и connect-src, и оба приезжают позже.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
