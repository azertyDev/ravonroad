# Заголовки безопасности SRS §9.8. Подключаются и в server, и в каждый location,
# где есть свой add_header: nginx не наследует add_header на уровень, где он объявлен
# заново, и молча потерял бы весь этот файл.

add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "geolocation=(self), camera=()" always;

# TLS терминируется здесь же, когда появится домен и сертификат (spec «требует решения», п.3).
# До этого заголовок отдаётся, но браузером по http игнорируется.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# script-src и connect-src открыты под Яндекс JS API: карта приезжает в 003, тогда же
# перечень доменов уточняется по фактическим запросам в консоли (SRS §16 п.14).
# img-src получит хост S3 вместе с первыми фотографиями в 002.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' https://api-maps.yandex.ru; connect-src 'self' https://*.yandex.ru https://*.yandex.net; frame-ancestors 'none'; base-uri 'none'" always;
