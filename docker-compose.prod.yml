# Прод — Contabo Cloud VPS 4, 4 vCPU / 8 ГБ / 100 ГБ SSD (SRS §12.1). Лимиты оставлены такими же, какими были
# на 2 ГБ: они посчитаны под всплеск §1.6, а не под размер машины. Свободная память
# полезнее в page cache Postgres, чем в потолке, до которого никто не дойдёт.

services:
  db:
    mem_limit: 640m
    environment:
      # `:?` вместо `:-` из базового файла: не заданный пароль обязан ронять запуск,
      # а не молча подставлять значение, которое лежит в публичном репозитории.
      # Строка подключения api собирается из этой же переменной и остаётся согласованной.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=20
      - -c
      - huge_pages=off

  # Сборка образов на сервере запрещена (SRS §12.2 п.1): развёрнутый образ обязан
  # соответствовать коммиту, а на dev-машине в 1 ГБ сборка вдобавок не помещается —
  # образы приезжают готовыми из GHCR. `!reset` снимает build: из базового файла — без
  # него `docker compose up --build` и `docker compose run migrate` на голой машине
  # начали бы собирать прямо на проде.
  api:
    build: !reset null
    mem_limit: 576m
    environment:
      NODE_OPTIONS: --max-old-space-size=384

  edge:
    build: !reset null
    mem_limit: 96m

  migrate:
    build: !reset null
